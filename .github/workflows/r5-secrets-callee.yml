name: r5-secrets-callee
on:
  workflow_call:
    secrets:
      CANARY_CALLER:
        required: false
      CANARY_CALLEE:
        required: false
      CANARY_ORG:
        required: false
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: report which canaries are set (names only)
        env:
          C_CALLER: ${{ secrets.CANARY_CALLER }}
          C_CALLEE: ${{ secrets.CANARY_CALLEE }}
          C_ORG: ${{ secrets.CANARY_ORG }}
          # undeclared inherit-only names
          C_CALLER2: ${{ secrets.CANARY_CALLER }}
        run: |
          python3 - <<'PY'
          import os, hashlib
          def h(v):
              if not v:
                  return "EMPTY"
              return "set len=%d sha256=%s" % (len(v), hashlib.sha256(v.encode()).hexdigest()[:12])
          print("repo", os.environ.get("GITHUB_REPOSITORY"))
          print("workflow_ref", os.environ.get("GITHUB_WORKFLOW_REF"))
          print("CANARY_CALLER", h(os.environ.get("C_CALLER")))
          print("CANARY_CALLEE", h(os.environ.get("C_CALLEE")))
          print("CANARY_ORG", h(os.environ.get("C_ORG")))
          PY
