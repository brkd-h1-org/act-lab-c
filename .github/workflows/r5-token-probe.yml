name: r5-token-probe
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  actions: write
  packages: write
  attestations: write
jobs:
  mint:
    runs-on: ubuntu-latest
    steps:
      - name: probe GITHUB_TOKEN runner + extra APIs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          echo "actor=${GITHUB_ACTOR} repo=${GITHUB_REPOSITORY} ref=${GITHUB_REF}"
          echo "token_len=${#GH_TOKEN} prefix=${GH_TOKEN:0:8}"
          hdr=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -H "User-Agent: r5-token-probe")
          probe() { echo "=== $1 ==="; shift; curl -sS -D - -o /tmp/body "$@" | head -n 20; echo "BODY: $(head -c 400 /tmp/body)"; echo; }
          probe repo-reg-token POST "${hdr[@]}" -X POST https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners/registration-token
          probe repo-rm-token POST "${hdr[@]}" -X POST https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners/remove-token
          probe repo-jit POST "${hdr[@]}" -X POST https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners/generate-jitconfig -d '{"name":"r5-ght","runner_group_id":1,"labels":["self-hosted"]}'
          probe repo-runners GET "${hdr[@]}" https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners
          probe org-reg-token POST "${hdr[@]}" -X POST https://api.github.com/orgs/brkd-h1-org/actions/runners/registration-token
          probe org-rm-token POST "${hdr[@]}" -X POST https://api.github.com/orgs/brkd-h1-org/actions/runners/remove-token
          probe org-jit POST "${hdr[@]}" -X POST https://api.github.com/orgs/brkd-h1-org/actions/runners/generate-jitconfig -d '{"name":"r5-ght-org","runner_group_id":1,"labels":["self-hosted"]}'
          probe org-runners GET "${hdr[@]}" https://api.github.com/orgs/brkd-h1-org/actions/runners
          probe other-repo-reg POST "${hdr[@]}" -X POST https://api.github.com/repos/brkd-h1/act-lab-b/actions/runners/registration-token
          probe other-repo-runners GET "${hdr[@]}" https://api.github.com/repos/brkd-h1/act-lab-b/actions/runners
          probe user GET "${hdr[@]}" https://api.github.com/user
          probe installation-repos GET "${hdr[@]}" https://api.github.com/installation/repositories
          # if a token was minted, try runner-registration with foreign url
          REG=$(python3 -c "import json; print(json.load(open('/tmp/body')).get('token',''))" 2>/dev/null)
          echo "(last body token prefix ${REG:0:8})"

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/probe
      - name: runtime token extra services
        run: python3 .github/actions/r5_runtime_probe.py
